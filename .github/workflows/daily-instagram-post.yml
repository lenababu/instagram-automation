name: Daily Instagram Reel

on:
  schedule:
    # Two posts a day, Asia/Kolkata (UTC+5:30). GitHub's cron is often late or skips a slot,
    # so each slot has three attempts; MIN_POST_GAP_HOURS makes the later ones no-ops once
    # the slot has been posted.
    - cron: "30 1 * * *"    # 7:00 AM IST
    - cron: "50 1 * * *"    # 7:20 AM IST (retry)
    - cron: "15 2 * * *"    # 7:45 AM IST (retry)
    - cron: "30 13 * * *"   # 7:00 PM IST
    - cron: "50 13 * * *"   # 7:20 PM IST (retry)
    - cron: "15 14 * * *"   # 7:45 PM IST (retry)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (analyse, caption, upload; do NOT publish or touch the sheet)"
        type: boolean
        default: true
      check_only:
        description: "Only verify credentials/connections, no processing"
        type: boolean
        default: false
      video:
        description: "Post this video instead of the next in order (filename or number, e.g. 6). Leave empty for normal order."
        type: string
        default: ""
      scheduled:
        description: "Set by the external scheduler (cron-job.org): behave like a scheduled run (AUTO_PUBLISH + 6h gap)"
        type: boolean
        default: false

# Never let two runs publish at the same time (e.g. a late scheduled run + a manual one).
concurrency:
  group: instagram-daily-post
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # needed by the keepalive step to re-enable this workflow

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_VIDEO_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_VIDEO_FOLDER_ID }}
      GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_THUMBNAIL_FOLDER_ID }}
      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      META_API_VERSION: ${{ vars.META_API_VERSION || 'v24.0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAND_CONTEXT: ${{ vars.BRAND_CONTEXT }}
      # "files" posts captions/<video>.txt and never calls the AI models; "ai" generates captions with Groq.
      CAPTION_MODE: ${{ vars.CAPTION_MODE || 'files' }}
      FORCE_VIDEO: ${{ github.event_name == 'workflow_dispatch' && inputs.video || '' }}
      # Scheduled runs publish for real only when the repository variable AUTO_PUBLISH is "true".
      # Manual runs follow the dry_run checkbox.
      # A manual run with scheduled=true (external trigger) is treated exactly like a cron run.
      IS_SCHEDULED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scheduled == true) }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.scheduled != true && inputs.dry_run == true) || ((github.event_name == 'schedule' || inputs.scheduled == true) && vars.AUTO_PUBLISH != 'true') }}
      # Scheduled runs: skip when something was already posted in the last 6 hours (retry crons).
      MIN_POST_GAP_HOURS: ${{ (github.event_name == 'schedule' || inputs.scheduled == true) && '6' || '0' }}
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Show mode
        run: |
          echo "event=${{ github.event_name }}  scheduled=$IS_SCHEDULED  DRY_RUN=$DRY_RUN  AUTO_PUBLISH=${{ vars.AUTO_PUBLISH }}  gap=${MIN_POST_GAP_HOURS}h"
          echo "Run started (UTC): $(date -u)"

      - name: Connection check only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: python -m app.main --check

      - name: Run daily job
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.check_only) }}
        run: python -m app.main

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="GitHub Actions run FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # This re-enables the workflow via the API on every run so it never goes dormant.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-instagram-post.yml --repo "${{ github.repository }}" || true
